services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Load the full repo-root .env (the file README's quickstart has you
    # create) into the API container: model providers, integrations, auth,
    # etc. `required: false` tolerates setups that export vars in the shell
    # and run `make docker` (the Makefile passes --env-file so ${VAR}
    # interpolation sees them) without a .env file.
    # NOTE: anything listed under `environment:` below SHADOWS the same key
    # from this env_file — keep that list to container-specific fixed paths.
    env_file:
      - path: ../.env
        required: false
    ports:
      - "8000:8000"
    environment:
      - VECTOR_STORE_PATH=/data/chroma_db
      - COMPANY_PROFILE_PATH=/data/company/profile.yaml
      - EPISODIC_DB_PATH=/data/episodic_memory.db
      - ENABLE_CACHING=${ENABLE_CACHING:-true}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
      # Outbound email goes through the Gmail Workspace MCP authenticated as
      # this address (see .env.example / docs). Leave blank to disable email.
      - EXEC_EMAIL_ADDRESS=${EXEC_EMAIL_ADDRESS:-}
      # Must match the value the UI sends, or every proxied call 401s.
      - BACKEND_SHARED_SECRET=${BACKEND_SHARED_SECRET:-}
      # Serve Claude calls from a Claude Pro/Max subscription instead of a
      # metered ANTHROPIC_API_KEY. Generate the token on any machine that can
      # complete the browser flow:
      #     claude setup-token
      # then put it in .env as CLAUDE_CODE_OAUTH_TOKEN. With this set you can
      # leave ANTHROPIC_API_KEY empty.
      # Note the trade-offs (rate limits are the real budget, no max_tokens or
      # per-block cache_control) — see README, "Running on a Claude
      # Subscription".
      - AGENT_SDK_ENABLED=${AGENT_SDK_ENABLED:-false}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}

    volumes:
      - executive_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ui:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ../packages/ui:/app
      - /app/node_modules
    # Deliberately NO env_file here: this container runs `npm install` at
    # boot, and npm postinstall scripts can read process.env — so the UI
    # gets only the variables it actually uses, not the backend's provider
    # keys and bot tokens. ${VAR:-} resolves from the repo-root .env when
    # invoked as `make docker` (the Makefile passes --env-file .env), or
    # from exported shell variables. Auth.js needs the AUTH_* set at
    # runtime — without them sign-in fails with MissingSecret (issue #44).
    environment:
      - NODE_ENV=development
      # Reach the API over the compose network (the UI proxy/auth default of
      # localhost:8000 resolves to the UI container itself, not the API).
      - BACKEND_BASE_URL=http://api:8000
      # NextAuth config. Without AUTH_SECRET the UI fails every request with
      # "There was a problem with the server configuration" / MissingSecret;
      # without the Google pair there is no provider to sign in with. These
      # reach the container only because `make docker` passes --env-file.
      # DISABLE_AUTH=true turns sign-in OFF entirely — every visitor is served
      # as the principal. The way to run on a LAN IP without Google's
      # HTTPS/no-raw-IP redirect rules. Trusted networks only.
      - DISABLE_AUTH=${DISABLE_AUTH:-false}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID:-}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET:-}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      # Leave unset locally — NextAuth then infers the origin from the request.
      # A deployment origin here sends local sign-in to that deployment.
      - AUTH_URL=${AUTH_URL:-}
      # Bootstrap allowlist, used until the People table has an email row.
      - AUTH_SECRET=${AUTH_SECRET:-}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID:-}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET:-}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST-true}
      - AUTH_URL=${AUTH_URL:-}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - BACKEND_SHARED_SECRET=${BACKEND_SHARED_SECRET:-}
    depends_on:
      - api

volumes:
  executive_data:
    driver: local
