services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - VECTOR_STORE_PATH=/data/chroma_db
      - COMPANY_PROFILE_PATH=/data/company/profile.yaml
      - EPISODIC_DB_PATH=/data/episodic_memory.db
      - ENABLE_CACHING=${ENABLE_CACHING:-true}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
      # Outbound email goes through the Gmail Workspace MCP authenticated as
      # this address (see .env.example / docs). Leave blank to disable email.
      - EXEC_EMAIL_ADDRESS=${EXEC_EMAIL_ADDRESS:-}
      # Must match the value the UI sends, or every proxied call 401s.
      - BACKEND_SHARED_SECRET=${BACKEND_SHARED_SECRET:-}
      # Serve Claude calls from a Claude Pro/Max subscription instead of a
      # metered ANTHROPIC_API_KEY. Generate the token on any machine that can
      # complete the browser flow:
      #     claude setup-token
      # then put it in .env as CLAUDE_CODE_OAUTH_TOKEN. With this set you can
      # leave ANTHROPIC_API_KEY empty.
      # Note the trade-offs (rate limits are the real budget, no max_tokens or
      # per-block cache_control) — see README, "Running on a Claude
      # Subscription".
      - AGENT_SDK_ENABLED=${AGENT_SDK_ENABLED:-false}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - executive_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ui:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ../packages/ui:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Reach the API over the compose network (the UI proxy/auth default of
      # localhost:8000 resolves to the UI container itself, not the API).
      - BACKEND_BASE_URL=http://api:8000
      # NextAuth config. Without AUTH_SECRET the UI fails every request with
      # "There was a problem with the server configuration" / MissingSecret;
      # without the Google pair there is no provider to sign in with. These
      # reach the container only because `make docker` passes --env-file.
      - AUTH_SECRET=${AUTH_SECRET:-}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID:-}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET:-}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      # Leave unset locally — NextAuth then infers the origin from the request.
      # A deployment origin here sends local sign-in to that deployment.
      - AUTH_URL=${AUTH_URL:-}
      # Bootstrap allowlist, used until the People table has an email row.
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - BACKEND_SHARED_SECRET=${BACKEND_SHARED_SECRET:-}
    depends_on:
      - api

volumes:
  executive_data:
    driver: local
