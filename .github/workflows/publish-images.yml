name: Publish images (GHCR)

# Builds the API and UI images and pushes them to GitHub Container Registry so
# they can be pulled onto any Docker host without building locally. This is the
# supported way to run Open Executive on a machine where the native
# @next/swc binary is incompatible with the host glibc (Ubuntu 25.10 /
# glibc 2.42) — the UI image is built on node:22-alpine (musl), which is
# unaffected.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Which image to build"
        required: true
        default: "both"
        type: choice
        options: [both, api, ui]

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required to push to ghcr.io with the built-in GITHUB_TOKEN.
  packages: write

jobs:
  publish:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/Dockerfile
          - image: ui
            dockerfile: docker/Dockerfile.ui
    steps:
      - uses: actions/checkout@v5

      # The API image bakes PyTorch plus two embedding models, which does not
      # fit alongside the runner's preinstalled toolchains. Reclaiming the
      # unused SDKs buys ~20 GB and is cheaper than a failed build.
      - name: Free disk space (API only)
        if: matrix.image == 'api'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      # GHCR rejects uppercase image names, and this repo's owner and name are
      # both mixed case — pushing ${{ github.repository }} verbatim fails with
      # "invalid reference format". Lowercase it once, here.
      - name: Resolve lowercase image name
        id: name
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' \
            | tr '[:upper:]' '[:lower:]')-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          # `latest` only on the default branch, so a tag build never
          # retargets what a Docker host pulling :latest will get.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers between runs; without this every build reinstalls
          # dependencies and re-bakes the API's embedding models from scratch.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summary
        run: |
          {
            echo "### \`${{ matrix.image }}\` pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
